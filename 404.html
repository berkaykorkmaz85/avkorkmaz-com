<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sayfa Bulunamadı (404) | Korkmaz Hukuk Bürosu — Denizli</title>
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182430; --paper:#EDE8DD; --paper-high:#F8F5EE; --paper-line:#DAD3C3;
    --bronze:#9C6B2E; --bronze-deep:#7A5322; --text:#22303e; --text-muted:#5a6472;
    --text-on-ink:#EDE8DD;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#0f171f; --paper:#141b23; --paper-high:#1a232c; --paper-line:#2c3946;
      --bronze:#c9975a; --bronze-deep:#e0b17c; --text:#e7e2d6; --text-muted:#9aa5b1; --text-on-ink:#e7e2d6;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--text); font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif; line-height:1.6; min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit;}
  .wrap{max-width:640px; margin:0 auto; padding:28px;}
  header{border-bottom:1px solid var(--paper-line);}
  .nav{max-width:1120px; margin:0 auto; padding:16px 28px; display:flex; align-items:center;}
  .wordmark{font-family:"Newsreader", serif; font-weight:600; font-size:19px; text-decoration:none; display:inline-flex; align-items:center; gap:10px;}
  .wordmark span{color:var(--bronze-deep);}
  .wordmark-logo{height:30px; width:auto;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .wordmark-logo{filter:invert(1);} }
  main{flex:1; display:flex; align-items:center; justify-content:center; text-align:center;}
  .code{font-family:"Newsreader",serif; font-size:96px; font-weight:700; color:var(--bronze); line-height:1; margin:0;}
  h1{font-family:"Newsreader",serif; font-weight:600; font-size:28px; margin:12px 0 10px; color:var(--text);}
  p{color:var(--text-muted); font-size:16px; margin:0 0 26px;}
  .actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px; padding:12px 22px; border-radius:2px; text-decoration:none; border:1px solid var(--paper-line);}
  .btn-primary{background:var(--bronze); color:var(--ink); border-color:transparent;}
  .btn-primary:hover{background:var(--bronze-deep);}
  .btn-ghost:hover{border-color:var(--bronze);}
  footer{border-top:1px solid var(--paper-line); text-align:center; padding:20px; font-size:13px; color:var(--text-muted);}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="wordmark" href="/" aria-label="Ana sayfa"><img src="/bk-logo.png" alt="Korkmaz Hukuk Bürosu amblemi" class="wordmark-logo">KORKMAZ <span>HUKUK BÜROSU</span></a>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Bağlantı taşınmış veya kaldırılmış olabilir. Aşağıdan ana sayfaya dönebilir ya da hukuki rehberlerimize göz atabilirsiniz.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Ana Sayfa</a>
      <a class="btn btn-ghost" href="/makaleler.html">Makaleler</a>
      <a class="btn btn-ghost" href="/#iletisim">İletişim</a>
    </div>
  </div>
</main>
<footer>© 2026 Korkmaz Hukuk Bürosu — Av. Berkay Korkmaz · Denizli Barosu</footer>
</body>
</html>
